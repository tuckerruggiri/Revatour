<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Revatour clock</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#0e1117;color:#fff;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
  #box{height:100%;display:flex;align-items:stretch;border:2px solid #232a36;border-radius:14px;overflow:hidden;transition:border-color .15s,background .15s}
  #box.hot{border-color:#ff5252;background:#1a1012}
  #box.fast{background:#2a1215}
  #grip{width:22px;flex:none;-webkit-app-region:drag;cursor:grab;display:flex;align-items:center;justify-content:center;background:#151a23;color:#566074;font-size:14px;letter-spacing:-2px}
  #main{flex:1;min-width:0;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px;-webkit-app-region:no-drag}
  #main:hover{background:rgba(255,255,255,.04)}
  #t{font-size:28px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
  #t small{font-size:11px;font-weight:700;color:#7d889b;letter-spacing:.1em;margin-left:8px}
  #c{display:flex;gap:10px;font-size:12px;font-variant-numeric:tabular-nums;color:#aab3c2}
  #c span{min-width:3.8em}
  #c .nx{color:#ff6a6a;font-weight:800}
  #hint{font-size:10px;color:#566074;letter-spacing:.06em;text-transform:uppercase}
  #side{width:26px;flex:none;display:flex;flex-direction:column;-webkit-app-region:no-drag;background:#151a23}
  #side button{flex:1;border:0;background:transparent;color:#7d889b;cursor:pointer;font-size:14px}
  #side button:hover{background:#232a36;color:#fff}
</style></head>
<body>
<div id="box">
  <div id="grip" title="Drag to move">&#8942;&#8942;</div>
  <div id="main" title="Click to open Revatour"><div id="t">--:--:--<small>NY</small></div><div id="c"></div><div id="hint">Click to open</div></div>
  <div id="side"><button id="mn" title="Menu">&#8943;</button></div>
</div>
<script>
(function(){
  var fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  var t=document.getElementById("t"),c=document.getElementById("c"),box=document.getElementById("box");
  function f(n){return Math.floor(n/60)+":"+("0"+(n%60)).slice(-2)}
  function tick(){
    var now=Date.now(),sec=Math.floor(now/1000),left=function(p){return p-(sec%p)},s1=left(60);
    t.firstChild.nodeValue=fmt.format(now);
    c.innerHTML=[["1m",60],["2m",120],["5m",300],["15m",900]].map(function(x){var n=left(x[1]);return '<span class="'+(n<=10?"nx":"")+'">'+x[0]+" "+f(n)+"</span>"}).join("");
    box.classList.toggle("hot",s1<=10);box.classList.toggle("fast",s1<=3);
  }
  tick();setInterval(tick,250);
  document.getElementById("main").addEventListener("click",function(){window.revatourDesktop.expand()});
  document.getElementById("mn").addEventListener("click",function(){window.revatourDesktop.menu()});
  document.addEventListener("contextmenu",function(e){e.preventDefault();window.revatourDesktop.menu()});
})();
</script></body></html>
