<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1620">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stockspot"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__installEvt=e;window.dispatchEvent(new Event("ss-installable"))});</script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockspot · Log in</title>
  <script>try{var _t=localStorage.getItem("ss-theme");if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#14181f; --mute:#6b7280; --line:#e2e5ea; --brand:#1f6feb; --bad:#c0392b; --ok:#1a7f4b; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e1116; --card:#171b22; --ink:#e8ebf0; --mute:#8b94a3; --line:#2a303a; --brand:#4c8dff; --bad:#ff7b6b; --ok:#4cc38a; } }
    :root[data-theme="dark"] { --bg:#0e1116; --card:#171b22; --ink:#e8ebf0; --mute:#8b94a3; --line:#2a303a; --brand:#4c8dff; --bad:#ff7b6b; --ok:#4cc38a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
    .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
    .logo { font-weight:800; font-size:24px; letter-spacing:-.02em; margin:0 0 4px; }
    .sub { color:var(--mute); margin:0 0 20px; font-size:14px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--bg); padding:4px; border-radius:10px; margin-bottom:20px; }
    .tabs button { border:0; background:none; padding:9px; border-radius:7px; font:inherit; font-weight:600; color:var(--mute); cursor:pointer; }
    .tabs button[aria-selected="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); font:inherit; }
    input:focus { outline:2px solid var(--brand); outline-offset:1px; }
    .hint { font-size:12px; margin-top:5px; min-height:16px; color:var(--mute); }
    .hint.bad { color:var(--bad); } .hint.ok { color:var(--ok); }
    .pw { position:relative; } .pw button { position:absolute; right:6px; top:6px; border:0; background:none; color:var(--brand); font:inherit; font-size:13px; font-weight:600; padding:6px 8px; cursor:pointer; }
    .go { width:100%; margin-top:20px; padding:12px; border:0; border-radius:9px; background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    .go:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:14px; font-size:14px; min-height:20px; } .msg.bad { color:var(--bad); } .msg.ok { color:var(--ok); }
    .link { display:block; margin:14px auto 0; border:0; background:none; color:var(--brand); font:inherit; font-size:13px; cursor:pointer; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="logo">Stockspot</h1>
    <p class="sub">Your trading journal and guru page, built by AI.</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabin" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tabup" aria-selected="false">Sign up</button>
    </div>

    <form id="form" novalidate>
      <div id="rowuser" hidden>
        <label for="username">Username</label>
        <input id="username" autocomplete="username" maxlength="20" placeholder="e.g. tucker_trades" />
        <div class="hint" id="userhint">3–20 letters, numbers or underscores.</div>
      </div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@email.com" />

      <div id="rowpw">
        <label for="pw">Password</label>
        <div class="pw">
          <input id="pw" type="password" autocomplete="current-password" />
          <button type="button" id="showpw">Show</button>
        </div>
        <div class="hint" id="pwhint"></div>
      </div>

      <button class="go" id="go" type="submit">Log in</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button type="button" class="link" id="forgot">Forgot password?</button>
    </form>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
