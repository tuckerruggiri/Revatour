<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockspot · Offline</title>
<style>:root{--bg:#f3f3f3;--ink:#0a0a0a;--mute:#666;--accent:#0a0a0a}@media (prefers-color-scheme:dark){:root{--bg:#000000;--ink:#f2f2f2;--mute:#9a9a9a;--accent:#f2f2f2}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
h1{margin:0 0 8px}p{color:var(--mute);margin:0 0 16px}button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}</style></head>
<body><main><h1>You're offline</h1><p>Stockspot needs a connection to load your journal and feed.</p><button type="button" onclick="location.reload()">Try again</button></main></body></html>
