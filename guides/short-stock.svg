<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">How to short a stock</text><text x="36" y="76" fill="#8fa3b3" font-size="15">Sell first, buy back lower. Put the stop above your entry.</text><line x1="36" x2="924" y1="110" y2="110" stroke="#1f3142"/><line x1="36" x2="924" y1="205" y2="205" stroke="#1f3142"/><line x1="36" x2="924" y1="300" y2="300" stroke="#1f3142"/><line x1="36" x2="924" y1="395" y2="395" stroke="#1f3142"/><line x1="36" x2="924" y1="490" y2="490" stroke="#1f3142"/><path d="M67.7 205.0 L131.1 181.2 L194.6 200.2 L258.0 228.8 L321.4 209.8 L384.9 243.0 L448.3 276.2 L511.7 262.0 L575.1 300.0 L638.6 333.3 L702.0 319.0 L765.4 352.3 L828.9 385.5 L892.3 418.8" fill="none" stroke="#e6eef4" stroke-width="3.5" stroke-linejoin="round" /><line x1="36" x2="924" y1="229" y2="229" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="36" x2="924" y1="167" y2="167" stroke="#f59e0b" stroke-width="2.5"/><line x1="36" x2="924" y1="385" y2="385" stroke="#10b981" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="48" y="133.0000000000001" width="330" height="30" rx="15" fill="#f59e0b" opacity=".18"/><rect x="48" y="133.0000000000001" width="330" height="30" rx="15" fill="none" stroke="#f59e0b"/><text x="213" y="153.0000000000001" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="600">Stop above entry: losses can keep growing</text><rect x="48" y="236.75" width="150" height="30" rx="15" fill="#ef4444" opacity=".18"/><rect x="48" y="236.75" width="150" height="30" rx="15" fill="none" stroke="#ef4444"/><text x="123" y="256.75" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="600">Sell short here</text><rect x="48" y="393.4999999999999" width="390" height="30" rx="15" fill="#10b981" opacity=".18"/><rect x="48" y="393.4999999999999" width="390" height="30" rx="15" fill="none" stroke="#10b981"/><text x="243" y="413.4999999999999" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600">Buy to cover: profit = sell price minus cover price</text></svg>