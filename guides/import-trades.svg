<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">Bring your trades into Revatour</text><text x="36" y="76" fill="#8fa3b3" font-size="15">From thinkorswim to your journal.</text><rect x="36.0" y="150" width="252" height="220" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="70.0" cy="184" r="18" fill="#3b82f6"/><text x="70.0" y="190" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="100.0" y="190" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Export</text><text x="58.0" y="228" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">thinkorswim: Monitor, then</text><text x="58.0" y="252" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Account Statement. Save</text><text x="58.0" y="276" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">the CSV.</text><rect x="354.0" y="150" width="252" height="220" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="388.0" cy="184" r="18" fill="#8b5cf6"/><text x="388.0" y="190" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="418.0" y="190" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Studio</text><text x="376.0" y="228" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Upload the file or paste</text><text x="376.0" y="252" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">the rows with the header</text><text x="376.0" y="276" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">row.</text><rect x="672.0" y="150" width="252" height="220" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="706.0" cy="184" r="18" fill="#10b981"/><text x="706.0" y="190" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="736.0" y="190" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Group and save</text><text x="694.0" y="228" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Choose grouped, entry or</text><text x="694.0" y="252" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">exit view, then save the</text><text x="694.0" y="276" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">day.</text></svg>