<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">Position sizing from your risk</text><text x="36" y="76" fill="#8fa3b3" font-size="15">Shares = your 1R divided by the risk per share.</text><rect x="36" y="110" width="264" height="120" rx="14" fill="#162636" stroke="#1f3142"/><text x="58" y="148" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Account</text><text x="58" y="198" fill="#3b82f6" font-size="40" font-weight="800" text-anchor="start">$25,000</text><text x="324" y="184" fill="#8fa3b3" font-size="32" font-weight="700" text-anchor="middle">→</text><rect x="348" y="110" width="264" height="120" rx="14" fill="#162636" stroke="#1f3142"/><text x="370" y="148" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Risk per trade</text><text x="370" y="198" fill="#8b5cf6" font-size="40" font-weight="800" text-anchor="start">1%</text><text x="636" y="184" fill="#8fa3b3" font-size="32" font-weight="700" text-anchor="middle">→</text><rect x="660" y="110" width="264" height="120" rx="14" fill="#162636" stroke="#1f3142"/><text x="682" y="148" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Your 1R</text><text x="682" y="198" fill="#f59e0b" font-size="40" font-weight="800" text-anchor="start">$250</text><rect x="36" y="262" width="420" height="110" rx="14" fill="#162636" stroke="#1f3142"/><text x="58" y="298" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Entry</text><text x="58" y="346" fill="#e6eef4" font-size="36" font-weight="800" text-anchor="start">$10.00</text><rect x="480" y="262" width="444" height="110" rx="14" fill="#162636" stroke="#1f3142"/><text x="502" y="298" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Stop</text><text x="502" y="346" fill="#e6eef4" font-size="36" font-weight="800" text-anchor="start">$9.50</text><rect x="36" y="396" width="888" height="110" rx="14" fill="#10311f" stroke="#22c55e"/><text x="60" y="436" fill="#e6eef4" font-size="18" font-weight="600" text-anchor="start">Risk per share = $10.00 − $9.50 = $0.50</text><text x="60" y="478" fill="#22c55e" font-size="26" font-weight="800" text-anchor="start">Shares = $250 ÷ $0.50 = 500 shares</text></svg>