<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">Opening a brokerage account</text><text x="36" y="76" fill="#8fa3b3" font-size="15">Six steps, about 15 minutes of paperwork.</text><rect x="36.0" y="118" width="252" height="150" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="70.0" cy="152" r="18" fill="#3b82f6"/><text x="70.0" y="158" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="100.0" y="158" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Pick a broker</text><text x="58.0" y="196" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Compare fees, platform,</text><text x="58.0" y="220" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">shorting and options.</text><rect x="354.0" y="118" width="252" height="150" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="388.0" cy="152" r="18" fill="#10b981"/><text x="388.0" y="158" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="418.0" y="158" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Choose account type</text><text x="376.0" y="196" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Taxable, IRA, cash</text><text x="376.0" y="220" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">or margin.</text><rect x="672.0" y="118" width="252" height="150" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="706.0" cy="152" r="18" fill="#f59e0b"/><text x="706.0" y="158" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="736.0" y="158" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Gather your details</text><text x="694.0" y="196" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">ID, SSN, address,</text><text x="694.0" y="220" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">employer, income.</text><rect x="36.0" y="302" width="252" height="150" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="70.0" cy="336" r="18" fill="#8b5cf6"/><text x="70.0" y="342" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="100.0" y="342" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Apply</text><text x="58.0" y="380" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Answer honestly. It sets</text><text x="58.0" y="404" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">your approvals.</text><rect x="354.0" y="302" width="252" height="150" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="388.0" cy="336" r="18" fill="#06b6d4"/><text x="388.0" y="342" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">5</text><text x="418.0" y="342" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">Fund it</text><text x="376.0" y="380" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Link your bank (ACH).</text><text x="376.0" y="404" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Takes 1 to 3 days.</text><rect x="672.0" y="302" width="252" height="150" rx="14" fill="#162636" stroke="#1f3142"/><circle cx="706.0" cy="336" r="18" fill="#ec4899"/><text x="706.0" y="342" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">6</text><text x="736.0" y="342" fill="#e6eef4" font-size="18" font-weight="700" text-anchor="start">First small trade</text><text x="694.0" y="380" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Learn the buttons</text><text x="694.0" y="404" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">with a few dollars.</text></svg>