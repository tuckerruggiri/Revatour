<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">Cash account vs margin account</text><text x="36" y="76" fill="#8fa3b3" font-size="15">What changes when you can borrow.</text><rect x="36" y="110" width="432" height="330" rx="14" fill="#162636" stroke="#1f3142"/><rect x="36" y="110" width="432" height="56" rx="14" fill="#10b981" opacity=".9"/><text x="60" y="146" fill="#fff" font-size="22" font-weight="800" text-anchor="start">CASH</text><circle cx="70" cy="208" r="6" fill="#10b981"/><text x="88" y="214" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Trade only with settled money</text><circle cx="70" cy="252" r="6" fill="#10b981"/><text x="88" y="258" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Sales settle next business day</text><circle cx="70" cy="296" r="6" fill="#10b981"/><text x="88" y="302" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">No shorting</text><circle cx="70" cy="340" r="6" fill="#10b981"/><text x="88" y="346" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">No borrowing, no interest</text><circle cx="70" cy="384" r="6" fill="#10b981"/><text x="88" y="390" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Simplest and safest</text><rect x="492" y="110" width="432" height="330" rx="14" fill="#162636" stroke="#1f3142"/><rect x="492" y="110" width="432" height="56" rx="14" fill="#f59e0b" opacity=".9"/><text x="516" y="146" fill="#fff" font-size="22" font-weight="800" text-anchor="start">MARGIN</text><circle cx="526" cy="208" r="6" fill="#f59e0b"/><text x="544" y="214" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Broker lends against holdings</text><circle cx="526" cy="252" r="6" fill="#f59e0b"/><text x="544" y="258" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Short selling allowed</text><circle cx="526" cy="296" r="6" fill="#f59e0b"/><text x="544" y="302" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Interest on borrowed money</text><circle cx="526" cy="340" r="6" fill="#f59e0b"/><text x="544" y="346" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Losses can exceed what you put in</text><circle cx="526" cy="384" r="6" fill="#f59e0b"/><text x="544" y="390" fill="#e6eef4" font-size="17" font-weight="400" text-anchor="start">Day trading rule applies under $25,000*</text><text x="36" y="478" fill="#8fa3b3" font-size="13" font-weight="400" text-anchor="start">*US pattern day trader rule. It has been under revision, so confirm the current rule with your broker.</text></svg>