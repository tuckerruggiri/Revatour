<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">Plan a trade the A+ way</text><text x="36" y="76" fill="#8fa3b3" font-size="15">Every box ticked before you click buy.</text><rect x="36" y="112" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="122" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 133 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="139" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">Calm and focused</text><rect x="36" y="162" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="172" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 183 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="189" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">No revenge trading</text><rect x="36" y="212" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="222" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 233 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="239" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">Market is cooperating</text><rect x="36" y="262" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="272" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 283 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="289" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">Clear level and trigger</text><rect x="36" y="312" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="322" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 333 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="339" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">Stop and size set</text><rect x="36" y="362" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="372" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 383 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="389" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">At least 1.5R to the target</text><rect x="36" y="412" width="540" height="42" rx="14" fill="#162636" stroke="#1f3142"/><rect x="52" y="422" width="22" height="22" rx="6" fill="#22c55e"/><path d="M57 433 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="90" y="439" fill="#e6eef4" font-size="17" font-weight="600" text-anchor="start">Inside today's loss limit</text><circle cx="760" cy="270" r="110" fill="none" stroke="#1f3142" stroke-width="22"/><circle cx="760" cy="270" r="110" fill="none" stroke="#22c55e" stroke-width="22" stroke-linecap="round" stroke-dasharray="691 691" transform="rotate(-90 760 270)"/><text x="760" y="288" fill="#22c55e" font-size="64" font-weight="800" text-anchor="middle">A+</text><text x="760" y="430" fill="#8fa3b3" font-size="18" font-weight="600" text-anchor="middle">7 of 7 done</text></svg>