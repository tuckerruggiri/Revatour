<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Arial,sans-serif"><rect width="960" height="540" rx="18" fill="#0f1b27"/><text x="36" y="48" fill="#e6eef4" font-size="26" font-weight="700">How to buy a stock</text><text x="36" y="76" fill="#8fa3b3" font-size="15">From the ticker to a confirmed fill.</text><rect x="240" y="100" width="480" height="400" rx="14" fill="#162636" stroke="#1f3142"/><text x="268" y="140" fill="#8fa3b3" font-size="13" font-weight="700" text-anchor="start">ORDER TICKET</text><text x="268" y="182" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Symbol</text><rect x="440" y="160" width="248" height="34" rx="8" fill="#0f1b27" stroke="#1f3142"/><text x="456" y="183" fill="#e6eef4" font-size="16" font-weight="700" text-anchor="start">AAPL</text><text x="268" y="228" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Action</text><rect x="440" y="206" width="248" height="34" rx="8" fill="#0f1b27" stroke="#1f3142"/><text x="456" y="229" fill="#10b981" font-size="16" font-weight="700" text-anchor="start">Buy</text><text x="268" y="274" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Quantity</text><rect x="440" y="252" width="248" height="34" rx="8" fill="#0f1b27" stroke="#1f3142"/><text x="456" y="275" fill="#e6eef4" font-size="16" font-weight="700" text-anchor="start">10</text><text x="268" y="320" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Order type</text><rect x="440" y="298" width="248" height="34" rx="8" fill="#0f1b27" stroke="#1f3142"/><text x="456" y="321" fill="#e6eef4" font-size="16" font-weight="700" text-anchor="start">Limit</text><text x="268" y="366" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Limit price</text><rect x="440" y="344" width="248" height="34" rx="8" fill="#0f1b27" stroke="#1f3142"/><text x="456" y="367" fill="#e6eef4" font-size="16" font-weight="700" text-anchor="start">$230.00</text><text x="268" y="412" fill="#8fa3b3" font-size="15" font-weight="400" text-anchor="start">Time in force</text><rect x="440" y="390" width="248" height="34" rx="8" fill="#0f1b27" stroke="#1f3142"/><text x="456" y="413" fill="#e6eef4" font-size="16" font-weight="700" text-anchor="start">Day</text><rect x="268" y="448" width="420" height="40" rx="10" fill="#10b981"/><text x="478" y="474" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Review and submit</text><rect x="36" y="150" width="190" height="30" rx="15" fill="#3b82f6" opacity=".18"/><rect x="36" y="150" width="190" height="30" rx="15" fill="none" stroke="#3b82f6"/><text x="131" y="170" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="600">1  Choose the action</text><rect x="36" y="230" width="160" height="30" rx="15" fill="#8b5cf6" opacity=".18"/><rect x="36" y="230" width="160" height="30" rx="15" fill="none" stroke="#8b5cf6"/><text x="116" y="250" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="600">2  Set the size</text><rect x="750" y="270" width="190" height="30" rx="15" fill="#f59e0b" opacity=".18"/><rect x="750" y="270" width="190" height="30" rx="15" fill="none" stroke="#f59e0b"/><text x="845" y="290" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="600">3  Pick the order type</text><rect x="750" y="350" width="190" height="30" rx="15" fill="#10b981" opacity=".18"/><rect x="750" y="350" width="190" height="30" rx="15" fill="none" stroke="#10b981"/><text x="845" y="370" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600">4  Check the preview</text></svg>